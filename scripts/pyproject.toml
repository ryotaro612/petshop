[project]
name = "petshop-tools"
version = "0.1.0"
description = "Local CPU post-processing for petshop: mask composite, frame extraction, loop selection, 780x780 normalize, sprite atlas packing."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
petshop = "petshop_tools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["petshop_tools"]
