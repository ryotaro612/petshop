[project]
name = "comfyui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryotaro Nakamura", email = "ryotaro612.ooo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.8",
    "alembic>=1.20.1",
    "av>=17.0.0",
    "blake3>=1.0.11",
    "comfy-aimdo==0.6.0",
    "comfy-angle>=0.1.1",
    "comfy-cli>=1.28.0",
    "comfy-kitchen==0.2.42",
    "comfyui-embedded-docs==0.5.17",
    "comfyui-frontend-package==1.59.11",
    "comfyui-workflow-templates==0.11.114",
    "einops>=0.8.2",
    "filelock>=4.3.0",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow>=10.1.0",
    "psutil>=7.2.2",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl>=3.1.8",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "safetensors>=0.4.2",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.3",
    "simpleeval>=1.0.0",
    "spandrel>=0.4.2",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.13.3",
    "torch>=2.15.0",
    "torchsde>=0.2.6",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=4.50.3",
    "yarl>=1.18.0",
]

[project.scripts]
comfyui = "comfyui:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
